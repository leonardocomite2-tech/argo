services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: argo
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: argo
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    depends_on: [db]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
