    id: "canonical_id — stabile, non si rinumera più"
    nome: ""
    alias: "rename e varianti (genealogia unica)"
    tipo: "skill | skill_suite | meta_skill | mcp | plugin | tool | runtime | harness | piattaforma | modello | directory | guida | servizio | integrazione"
