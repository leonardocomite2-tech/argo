    confidenza_storica: "EXACT | HIGH | RECONSTRUCTED | UNCERTAIN — dalla ricostruzione della master"
    promessa: "una riga: cosa dice di risolvere"
    curatela: "CORE | PILOT | OPTIONAL | NICCHIA | RISORSA | MODEL | PLATFORM | INTEGRATION | SKIP — giudizio di curatela della master, NON decisione"
