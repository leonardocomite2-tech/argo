# INDICE DEI CANDIDATI — Cantiere Skill & Tool
# v0.1 — 7 settembre 2026
# Posizione prevista nel repo: knowledge/indice_candidati.yaml
#
# Cos'è: il catalogo delle risorse esterne osservate, nel formato che le tre
# porte leggono. NON è una lista di cose da installare: una voce entra qui
# per essere confrontabile col registro degli attriti, niente altro.
#
# Il campo che decide è `attriti`. Oggi è vuoto ovunque: si riempie
# nell'accoppiamento manuale del Cantiere 1 e resta l'unica giustificazione
# per passare da `catalogato` a `in_valutazione`.

formato:
  campi:
    id: "numero progressivo, continua la numerazione della master list"
    nome: ""
    alias: "nomi precedenti o alternativi (genealogia unica)"
    tipo: "skill | skill_suite | meta_skill | mcp | plugin | tool | runtime | harness | piattaforma | directory | guida | servizio"
    fonte: "URL"
    fiducia_fonte: "alta | media | bassa | da_verificare"
    # alta  = Anthropic, vendor ufficiale, progetto con storia e manutenzione stabile
    # media = community nota, manutentore identificabile, repo con storia
    # bassa = virale recente, manutentore ignoto, nessuna storia
    # da_verificare = assegnazione rimandata all'ispezione (Porta 3)
    promessa: "una riga: cosa dice di risolvere"
    promessa_score: "ex jarvis_score — metadato di curatela, NON criterio di decisione"
    occorrenze: "quante volte incontrato in contenuti distinti"
    superficie: "sola_lettura | scrive | esegue | hook | rete | credenziali — compilata dall'ispettore, vuota alla catalogazione"
    stato: "catalogato | in_valutazione | adottato | tenuto_30gg | disinstallato | scartato"
    attriti: "[] — id dal registro_attriti. IL campo che decide."
    sovrapposizioni: "voci dell'indice che promettono la stessa cosa"
    note: ""

