  - nome: argo_voce
    stato: orienta
    nota_stato: >
      Fondamenta chiuse 10/9/2026 (schema + identità), lettori chiusi
      10/9/2026 (sei funzioni sola-lettura + harness CLI). Questa sessione
      (11/9/2026, passo 4) aggiunge il primo comportamento reale e la prima
      chiamata LLM del cantiere: un solo modo, "orienta"
      (argo/voce.py:genera_risposta — raccoglie le sei fonti di
      argo/stato.py, costruisce il system prompt da SOUL/IDENTITY/USER.md +
      istruzioni comportamentali esplicite + stato serializzato, chiama
      connectors/llm.py:chiama() con Haiku temperatura 0). Attivabile sia a
      mano da host con scripts/argo/orienta.py, sia da Telegram (PASSO 5,
      vedi sotto) — entrambi mandano il testo generato sul bot Telegram
      nuovo (ARGO_VOCE_BOT_TOKEN, stesso TELEGRAM_CHAT_ID del bot meccanico)
      — vedi condiviso telegram_notifica sotto per come
      connectors/telegram.py:notifica() è stato reso parametrico sul token
      senza toccare il bot esistente.
      PASSO 5 (11/9/2026): /orienta da Telegram. argo/voce.py deve girare da
      host (argo/stato.py:docker exec + STATO.md/git sul filesystem, vedi
      DEVIAZIONE sotto), ma un webhook Telegram risponde per forza da dentro
      il container api — ponte via la tabella jobs, non un refactor di
      argo/stato.py dentro Docker (decisione con Leonardo, footprint
      minimo): backend/main.py:407-466 (nuovo POST /webhook/argo, secret
      proprio ARGO_VOCE_WEBHOOK_SECRET, separato da /webhook/telegram del
      bot meccanico) valida chat_id==TELEGRAM_CHAT_ID (altrimenti ignora in
      silenzio) e comando==/orienta (altrimenti risposta fissa breve, niente
      LLM), poi accoda un job tipo='genera_orienta' con un check-poi-insert
      guardato da pg_advisory_xact_lock (pending/running) — è il tetto di
      chiamate: al più un job in volo, i tap ripetuti non moltiplicano le
      chiamate LLM. Il lock non è decorativo: un WHERE NOT EXISTS da solo
      non è atomico sotto READ COMMITTED fra connessioni concorrenti — trovato
      dalla review guardrail prima del commit, stesso fix già usato per
      garantisci_leggi_email/controlli_periodici/digest_serale. Nessuna
      riga in events (comando dell'operatore, non evento di dominio).
      scripts/argo/orienta_webhook.py (nuovo) lo consuma da cron host ogni
      minuto — claim atomico stesso idiom di worker/loop.py:claim_job ma via
      docker exec psql (non psycopg, stessa convenzione di argo/stato.py).
      worker/loop.py:claim_job esclude ora esplicitamente 'genera_orienta'
      dalla propria coda (altrimenti lo reclamerebbe per primo e fallirebbe
      con un ALERT falso). tabelle.scrive non è più vuoto: jobs, sia da
      backend/main.py che da orienta_webhook.py. Manuale, non in questo
      commit: ARGO_VOCE_WEBHOOK_SECRET in .env, setWebhook su Telegram,
      riga crontab per orienta_webhook.py — vedi STATO.md.
      CORREZIONI (11/9/2026, stesso giorno, dopo il primo collaudo reale):
      il testo aveva inventato una data e un hash di commit (dati che erano
      corretti nello stato passato) ed era più verboso del richiesto. Tre
      fix: (1) regola anti-invenzione esplicita in SOUL.md + in
      ISTRUZIONI_ORIENTA — date/hash/numeri/nomi/ID solo se presenti alla
      lettera nello stato, mai ricostruiti; nuovo campo "oggi" in
      raccogli_stato() così la data non va più calcolata dal modello; (2)
      ISTRUZIONI_ORIENTA rinforzata su "una sola prossima cosa poi stop,
      niente sezioni extra"; MAX_TOKENS_RISPOSTA 400→200; (3) stato
      serializzato in JSON compatto (non indentato) e
      decisioni_aperte_bloccano troncato a 3.000 caratteri (con nota
      esplicita) su una copia dentro _stato_per_prompt() — argo/stato.py e
      scripts/argo/stato_cli.py restano fedeli e completi. Costo per
      chiamata: da 11.485 a 7.787 token in ingresso misurati (-32%, stima di
      ~7.800 confermata quasi esatta). Nessuna tabella/env/confine di
      pipeline toccato da queste correzioni.
      PASSO 6 (11/9/2026) — secondo modo, "instrada": risponde a "ho N minuti
      e sono al telefono/computer, cosa chiude qualcosa?" invece di "dove
      sono?". argo/voce.py:costruisci_system_prompt ora prende `istruzioni`
      come parametro (stesso costruttore SOUL+IDENTITY+USER+stato per
      entrambi i modi, solo le regole cambiano) — genera_risposta() (orienta)
      passa ISTRUZIONI_ORIENTA, la nuova genera_risposta_instrada(minuti,
      contesto) passa ISTRUZIONI_INSTRADA. Nessuna nuova fonte di stato: le
      stesse sei di raccogli_stato(). Regola specifica del brief, esplicita
      nel prompt: a parità di finestra, ciò che CHIUDE qualcosa va proposto
      prima di ciò che ne APRE una — una sola proposta, dentro la finestra
      dichiarata, che rispetti il contesto fisico (niente Claude Code/
      terminale se "telefono"); se niente si adatta, lo dice e si ferma.
      Comando `/instrada <minuti> telefono|computer`: due nuove funzioni pure
      in connectors/telegram.py (stesso motivo di normalizza_comando al passo
      5 — vivono lì perché backend/main.py gira in Docker e non può importare
      argo/), argomenti_comando(testo) e interpreta_instrada(argomenti), che
      ritorna (minuti, contesto, errore) e non indovina mai un parametro
      mancante o fuori enum (telefono/computer, letterali). backend/main.py:
      COMANDO_INSTRADA nuovo, _accoda_job_argo(tipo_job, payload, chiave_lock)
      estratta da _gestisci_messaggio_argo (secondo uso reale dello stesso
      pattern lock+check+insert, prima solo per genera_orienta) e riusata per
      entrambi i comandi — lock e tetto (al più un job per tipo in volo)
      indipendenti tra orienta e instrada. scripts/argo/orienta_webhook.py
      generalizzato per reclamare job di entrambi i tipi (id,tipo,payload via
      json_agg, stesso stile di argo/stato.py:_query_db) e dirama alla
      funzione giusta — nome file invariato apposta: il crontab di Leonardo
      lancia già questo script ogni minuto (confermato attivo,
      orienta_webhook.log presente sul VPS), rinominarlo lo romperebbe in
      silenzio. worker/loop.py:claim_job esclude ora anche 'genera_instrada'
      dalla propria coda, stesso motivo di 'genera_orienta'. Nessuna nuova
      tabella, nessun nuovo secret: riusa ARGO_VOCE_BOT_TOKEN/
      ARGO_VOCE_WEBHOOK_SECRET/TELEGRAM_CHAT_ID/ANTHROPIC_API_KEY/
      LLM_TETTO_GIORNALIERO già configurati al passo 5. Collaudo end-to-end
      reale (due finestre diverse dal telefono) lasciato a Leonardo, come al
      passo 5.
      PASSO 7 (11/9/2026) — rifinitura post-collaudo, solo prompt: il primo
      collaudo reale di /instrada ha mostrato tre difetti, tutti nelle
      istruzioni comportamentali, zero codice di invio/raccolta stato
      toccato. (1) La risposta si chiudeva con una domanda di rilancio
      ("Vuoi il brief?") che promette un ponte non ancora esistente — nuovo
      bullet "Non rilancia" in knowledge/argo/SOUL.md + regola gemella in
      entrambe ISTRUZIONI_ORIENTA/ISTRUZIONI_INSTRADA: la risposta finisce
      con la proposta, mai con una domanda. (2) Markdown grezzo su Telegram
      (**...**) — decisione: niente parse_mode su connectors/telegram.py
      (condiviso col bot meccanico, e un testo LLM può rompere il parsing
      Markdown facendo fallire l'invio con 400), si vieta la formattazione
      nel prompt. Primo giro del divieto (solo asterischi/intestazioni/
      elenchi) insufficiente: il collaudo ha comunque prodotto backtick
      attorno ai nomi di file — corretto aggiungendo "niente backtick"
      esplicito + esempio concreto in entrambe le ISTRUZIONI_*, verificato
      pulito al secondo giro. (3) Contesto troppo lungo (tre date, un
      orario, due numeri di sessione) — nuovo bullet "un solo riferimento
      temporale" in entrambe; ISTRUZIONI_INSTRADA riceve anche "due o tre
      righe" (mancava, a differenza di ISTRUZIONI_ORIENTA che aveva già
      "Poche righe") — causa reale di un troncamento a metà frase osservato
      nel primo giro di collaudo (MAX_TOKENS_RISPOSTA 200 raggiunto).
      MAX_TOKENS_RISPOSTA lasciato invariato: i log mostravano già output
      fino a 188/200, abbassarlo avrebbe aumentato il rischio di
      troncamento silenzioso. Collaudo reale da host (tre chiamate vere,
      testo mandato su Telegram con ARGO_VOCE_BOT_TOKEN): nessun asterisco,
      nessun backtick, nessuna domanda finale, un solo riferimento
      temporale, 2-4 righe — dati citati verificati veri via argo/stato.py
      e git log. Nessuna tabella/env/confine di pipeline toccato.
      PASSO 8 (11/9/2026) — terzo modo, "avvisa": digest serale, l'unico in
      cui Argo scrive per primo. Verificata la sovrapposizione col digest
      meccanico esistente (worker/loop.py:digest_serale, 22:00) prima di
      scrivere codice: un'approvazione ferma genera già un alert Telegram
      immediato e una tantum a 6h (_controllo_approvazioni_bloccate) e il
      digest meccanico le elenca comunque ogni sera; un job fallito due
      volte genera già un alert immediato non deduplicato (fail_job,
      worker/loop.py:135, scatta quando tentativi>=2) più il conteggio nel
      digest. Decisione con Leonardo: mantenere i tre criteri del brief
      (approvazione >24h, job fallito due volte, osservazione grave) con
      anti-ripetizione ONE-SHOT per singolo item — mai lo stesso id/firma
      due sere di fila, a differenza del digest meccanico che ripete ogni
      sera; riuso di alert_inviati (nuovi prefissi avvisa_appr:/avvisa_job:)
      e di osservazioni.stato (nuova→riferita, contratto già dichiarato
      sotto) — zero tabelle nuove, zero migrazioni. Selezione deterministica
      in Python PRIMA di ogni chiamata LLM (argo/voce.py:_filtra_candidati_avviso,
      pura, e _raccogli_dati_avviso): se nessun candidato qualifica,
      genera_avviso() ritorna senza mai chiamare connectors/llm.py:chiama()
      — il silenzio è un esito di codice, non lasciato al giudizio del
      modello. Scoperta in sessione: jobs conteneva 109 righe stato='failed'
      di digest_serale dal 27-29/08 (bug thread_id::int, già noto e
      risolto) — riusare argo/stato.py:job_falliti() (all-time, per
      disegno) avrebbe inquinato il primo avviso; nuova
      argo/stato.py:job_falliti_recenti(ore=24) con finestra temporale,
      stessa di worker/loop.py:digest_serale, esclude test_approvazione
      come quel digest. Nuova argo/stato.py:chiavi_alert_con_prefisso()
      (nessuna finestra: l'anti-ripetizione di avvisa è per sempre).
      argo/voce.py resta sola lettura (guardrail statico invariato):
      genera_avviso() ritorna anche `marcatori` (chiavi alert_inviati +
      id osservazioni) ma non scrive — l'unico punto che scrive, oltre a
      jobs, è scripts/argo/orienta_webhook.py (gira da host, può scrivere),
      PRIMA dell'invio, mai dopo (stesso ordine "scrivi prima di inviare"
      già in uso altrove nel repo, stesso trade-off accettato in STATO.md).
      Schedulazione senza nuova riga di crontab: worker/loop.py:garantisci_genera_avviso
      (nuova, 22:15 — 15 minuti dopo il digest meccanico) enqueue-a un job
      'genera_avviso' una volta al giorno; non essendoci un handler Docker
      per questo tipo (deve girare da host, come genera_orienta/genera_instrada
      — worker/loop.py:claim_job esclude ora anche questo tipo), la funzione
      NON è solo un recupero d'emergenza come le altre garantisci_*: è il
      meccanismo di schedulazione stesso, perché nessun handler Docker può
      riaccodarsi da sé — riusa il cron esistente di orienta_webhook.py
      (già ogni minuto). Collaudo reale da host in questa sessione (vedi
      STATO.md per il testo).
      CANTIERE ARGO — IL PONTE, PASSO 1 (12/9/2026) — quarto modo, "brief":
      Argo — la voce chiuso lato tecnico (tre modi sopra) ed entrato in
      validazione d'uso di 30 giorni (deroga cantiere-parallelo, vedi
      STATO.md); il ponte apre in parallelo con lo stesso identico schema
