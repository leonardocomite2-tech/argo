  - nome: manutenzione_sistema
    stato: produzione
    sede: vps
    attivazione: >
      poll nel loop principale del worker (ogni 5s: tre garantisci_* +
      recover_orphaned_jobs + migra_job_notifica_risposta all'avvio) +
      poll controlli_periodici (ogni 15 minuti) + orario fisso
      digest_serale (22:00 Europe/Rome)
    produce:
      - alert Telegram (approvazioni bloccate >6h, poster mancante entro 30 min, volume anomalo >50 eventi/ora, scadenza approvals vicina entro 2h)
      - chiusura autonoma di approvals scadute
      - digest testuale serale via Telegram
      - riaccodo automatico dei job perenni se mancanti (self-healing)
    codice:
      - "worker/loop.py:80-107"
      - "worker/loop.py:453-758"
      - "worker/loop.py:761-925"
      - "worker/loop.py:1566-1706"
    tabelle:
      legge: [jobs, events, messages, approvals, soppressioni, alert_inviati]
      scrive: [alert_inviati, approvals, jobs]
    condivisi: [alert_una_volta, telegram_notifica]
    env: []
    esterni: [Telegram]
    contratti:
      - id: MS01
        enunciato: "Un'approvazione scaduta viene chiusa entro 15 minuti dalla scadenza"
        garantito_da: "worker/loop.py:853-904 (_controllo_scadenza_vicina chiude le scadute) richiamato da controlli_periodici ogni 15 minuti (worker/loop.py:907-925, riaccodo con run_after = now() + interval '15 minutes')"
      - id: MS02
        enunciato: "Il digest serale non salta le 22:00 anche a worker riavviato"
        garantito_da: "worker/loop.py:1595-1626 (garantisci_digest_serale, chiamata all'avvio e a ogni giro del loop; se le 22:00 di oggi sono già passate senza un job pending/running, lo riaccoda subito invece di aspettare il giorno dopo)"
      - id: MS03
        enunciato: "Nessun job resta in 'running' oltre un riavvio del worker"
        garantito_da: "worker/loop.py:1675-1684 (recover_orphaned_jobs, UPDATE jobs SET stato='pending' WHERE stato='running', eseguito a ogni avvio) — vedi MS04 per il limite di questa garanzia"
      - id: MS04
        enunciato: "recover_orphaned_jobs è corretto solo con un worker unico: con due, un riavvio rimetterebbe a pending job ancora vivi dell'altro worker"
        garantito_da: "docker-compose.yml, servizio worker senza deploy/replicas dichiarate (default: un solo container) — non è un guard nel codice, solo la topologia del compose; il commento a worker/loop.py:1676-1679 documenta l'assunzione ma non la impone"
    evidenza:
      - "DA_VERIFICARE / SOSPESO: questo flusso non è uno dei quattro nominati all'apertura del cantiere — non è innescato da un evento di dominio (poster/email/DM), opera sul sistema stesso (job, alert, digest). Trattato come quinta scheda pipeline, non come componente condiviso: DECISIONE confermata con Leonardo il 9/9/2026 (STATO.md)"
      - "loop principale ogni 5s: worker/loop.py:1702 (time.sleep(5)), claim_job worker/loop.py:80-107 (SELECT ... FOR UPDATE SKIP LOCKED + UPDATE stato='running')"
      - "FIX (11/9/2026): le tre garantisci_* (leggi_email/controlli_periodici/digest_serale) facevano un check-poi-insert non atomico — due processi worker sovrapposti (es. durante un redeploy) potevano entrambi trovare 'nessun job' e inserirne due, osservato in produzione su digest_serale (due job, stesso run_after, creati a 6 secondi di distanza). Corretto con pg_advisory_xact_lock (chiave propria per funzione) in testa a ciascuna, prima della SELECT — nessuna migrazione, nessun rischio per il self-chaining esistente. Dettagli in STATO.md, sessione 2026-09-11."
      - "controlli_periodici ogni 15 min: worker/loop.py:907-925, orchestratore di _controllo_approvazioni_bloccate (767-789), _controllo_poster_mancante (792-813), _controllo_volume_anomalo (816-838), _controllo_scadenza_vicina (841-892)"
      - "digest_serale: worker/loop.py:631-758, legge approvals/jobs/events/messages/soppressioni/alert_inviati in sola lettura (622-724 — legge alert_inviati a 697-701, CORRETTO al passo 2: mancava in tabelle.legge), riaccoda sé stesso alle 22:00 (738-743, prossimo_orario_digest)"
      - "idempotenza propria: _alert_una_volta worker/loop.py:761-776 (INSERT INTO alert_inviati ... ON CONFLICT DO NOTHING RETURNING chiave, chiave è PRIMARY KEY — db/migrations/002_alert_inviati.sql) — non è dedup_key su events né guardia di stato operatore, è un terzo meccanismo"
      - "self-healing: garantisci_leggi_email/controlli_periodici/digest_serale (worker/loop.py:1566-1626, SELECT 1 FROM jobs WHERE tipo=%s AND stato IN ('pending','running'), reinseriscono il job se assente, eseguite a ogni giro del loop — dall'11/9/2026 precedute da pg_advisory_xact_lock, vedi FIX sotto)"
      - "recover_orphaned_jobs: worker/loop.py:1675-1684 — presuppone un solo worker, commento esplicito a 1630-1633. Verificato al passo 2: docker-compose.yml non dichiara repliche per il servizio worker, quindi l'assunzione è corretta oggi (MS04)"
      - "migra_job_notifica_risposta: worker/loop.py:1629-1672, migrazione una tantum all'avvio (rinomina job classifica_messaggio -> notifica_risposta), non più rilevante a regime ma resta nel codice"
      - "PASSO 5 argo_voce (11/9/2026): claim_job (worker/loop.py:80-107, range mancante dal codice sopra nonostante fosse già citata in evidenza — CORRETTO in questo stesso passo) esclude ora esplicitamente tipo='genera_orienta' dalla propria SELECT. Quel tipo di job è consumato da scripts/argo/orienta_webhook.py da host (cron), non dal worker: senza l'esclusione questo loop lo avrebbe reclamato per primo (poll ogni 5s contro un cron ogni 60s), trovato nessun handler registrato e marcato 'failed' con un ALERT falso a ogni /orienta. Vedi argo_voce per il resto del disegno."

  - nome: lead_gen_host
    stato: concluso_roma
    sede: vps
    attivazione: "comando manuale nel container worker (docker compose exec worker python -m scripts.X), uno script alla volta — non è a job/eventi come le altre quattro pipeline"
    nota_stato: >
      Non è produzione corrente: gli script hanno concluso il lavoro su Roma
      e non girano adesso. La replica su altre città attende evidenza che il
      canale converta prima di riattivare il cantiere (skill leadgen-citta
      pronta per riaprirlo quando/se si decide di procedere).
