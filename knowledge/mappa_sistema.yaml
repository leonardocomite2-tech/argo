versione: 2
generata: 2026-09-09
nota: >
  Cantiere Panoptes-Mappa, passo 2: corretta sui punti dove la bozza del
  passo 1 era incompleta o incoerente (vedi STATO.md, sessione 9/9/2026,
  passo 2, per il resoconto completo), e riempito il campo `contratti` —
  la ragione per cui questa mappa esiste. Un contratto è un'affermazione
  che un'altra parte del sistema può assumere vera senza verificarla.

legenda_garantito_da: >
  Valori ammessi per `garantito_da`, in ordine di forza: riferimento a
  codice `file:riga` (una guardia deterministica, verificabile leggendo
  quel punto) · `test:<path>` (un test automatico esistente che la
  copre) · una nota di topologia/infrastruttura non applicativa (es. MS04:
  "un solo worker" garantito dal compose, non da una guardia nel codice)
  · `eval` (proprietà di un output generato da un LLM — nessuna guardia
  deterministica può verificarla a runtime; appartiene a una suite di
  valutazione con output atteso, non a un test di contratto) · `nessuno`
  (nessun controllo, di nessun tipo, esiste oggi — è la lista dei test/eval
  del prossimo cantiere, non un difetto della mappa).

pipeline:
  - nome: poster_host
    stato: produzione
    sede: vps
    attivazione: "webhook POST /webhook/ghl/form"
    produce:
      - poster PNG generato su misura (host_code) e inviato come allegato JPEG
      - email all'host (poster pronto, avviso codice invalido, depliant digitale differito 24h)
      - righe in events (form.submitted, form.codice_invalido) e in messages (poster, avviso, depliant)
      - job accodati (avvisa_codice_invalido, genera_poster, invia_depliant)
      - alert Telegram se il codice ricevuto ha caratteri non validi o è troppo lungo
    codice:
      - "backend/main.py:47-177"
      - "worker/loop.py:151-311"
      - "media/poster.py"
      - "templates/poster_base.png"
      - "templates/Montserrat-Bold.ttf"
      - "connectors/testi.py"
    tabelle:
      legge: [events]
      scrive: [events, messages, jobs]
    condivisi: [mailer, telegram_notifica]
    env:
      - GHL_WEBHOOK_SECRET
    esterni: [SMTP/Gmail, Telegram]
    contratti:
      - id: PH01
        enunciato: "Mai due poster per lo stesso host+codice"
        garantito_da: "backend/main.py:151-163 (dedup_key ghl:{submission_id}:{host_code}, ON CONFLICT (dedup_key) DO NOTHING RETURNING id — submission_id è sempre {{contact.id}} in GHL, quindi identifica l'host)"
      - id: PH02
        enunciato: "Nessun poster generato per un codice invalido"
        garantito_da: "backend/main.py:78-141 (validazione host_code prima dell'instradamento) + backend/main.py:169-174 (job genera_poster accodato solo nel ramo senza motivo_invalido, mai in quello form.codice_invalido)"
      - id: PH03
        enunciato: "Il depliant parte 24h dopo il poster, mai prima"
        garantito_da: "worker/loop.py:210-214 (INSERT jobs invia_depliant con run_after = now() + interval '24 hours') + worker/loop.py:76 (claim_job, WHERE run_after <= now())"
      - id: PH04
        enunciato: "Nessuna doppia email (poster/avviso/depliant) per lo stesso evento, anche se il job viene rilanciato"
        garantito_da: "indice unico messages_thread_canale_direzione_uniq (db/migrations/001_messages_unique.sql) + guardia ON CONFLICT ... DO NOTHING RETURNING id in worker/loop.py:186-193,246-253,294-301"
    evidenza:
      - "route: backend/main.py:47-177 (POST /webhook/ghl/form)"
      - "auth: backend/main.py:49-50 (header X-Argo-Secret vs GHL_WEBHOOK_SECRET)"
      - "scrive events: backend/main.py:117-127 (form.codice_invalido), 153-163 (form.submitted) — CORRETTO al passo 2, mancava in tabelle.scrive nella bozza del passo 1 nonostante l'evidenza lo documentasse già"
      - "job accodati: backend/main.py:135 (avvisa_codice_invalido), 171 (genera_poster)"
      - "handler genera_poster: worker/loop.py:151-216, legge events 159-163, scrive messages con guardia ON CONFLICT (thread_id,canale,direzione) 186-193, accoda invia_depliant fra 24h 210-214"
      - "handler avvisa_codice_invalido: worker/loop.py:219-261"
      - "handler invia_depliant: worker/loop.py:264-311, thread_id distinto f\"{event_id}:depliant\" per non collidere col thread del poster (nota esplicita a loop.py:285-289) — eccezione email transazionale documentata in CLAUDE.md, non passa da approvals"
      - "self-contained: worker/loop.py — nessuna di queste tre funzioni tocca contacts/identities/approvals"
      - "generazione immagine: media/poster.py:18-40 (auto-fit font 80->20, box (994,2580)-(1423,2680), font Montserrat-Bold)"
      - "invio: connectors/mailer.py invia_email, chiamata a worker/loop.py:205,260; invia_email_reply_box per il depliant, worker/loop.py:309"
      - "alert su codice invalido malformato: backend/main.py:87-91,98-102 (notifica Telegram — il JS di sanificazione del form potrebbe essere rotto)"

  - nome: risposte_email
    stato: produzione
    sede: vps
    attivazione: "poll IMAP job perenne leggi_email (ogni 2 minuti, riaccodato da sé) + poll jobs del worker (ogni 5s)"
    produce:
      - righe in messages (email in ingresso classificata, eventuale risposta in uscita)
      - riga in approvals + richiesta di approvazione su Telegram, se la categoria è interessato/domanda con confidenza sufficiente
      - email di risposta inviata all'host/prospect, dopo approvazione
      - riga in soppressioni per bounce definitivo o categoria di disiscrizione/non_interessato
      - aggiornamento contacts.stato per disiscrizione/non_interessato
    codice:
      - "worker/loop.py:314-413"
      - "worker/loop.py:916-967"
      - "worker/loop.py:1210-1388"
      - "worker/loop.py:1391-1459"
      - "connectors/imap_reader.py"
    tabelle:
      legge: [events, approvals, messages]
      scrive: [events, jobs, soppressioni, messages, contacts, approvals, alert_inviati]
    condivisi:
      - valuta_e_rispondi
      - invia_risposta
      - classificatore
      - drafter
      - approvazione_telegram
      - mailer
      - alert_una_volta
    env:
      - IMAP_HOST
      - IMAP_PORT
      - "MAILBOX_{n}_USER/PASS (n=1..6 nel .env attuale: 4 caselle attive + 2 in warmup; previsto passaggio a 8 quando le prossime due entreranno in warmup)"
      - WARMUP_TAG
      - TEST_EMAIL_DEST
    esterni: [IMAP, SMTP/Gmail, Anthropic API (Haiku, via classificatore/drafter condivisi), Telegram]
    contratti:
      - id: RE01
        enunciato: "Nessuna risposta redatta dall'LLM esce senza passare da approvals in stato approvata o modificata"
        garantito_da: "worker/loop.py:1228-1232 (guardia stato IN ('approvata','modificata') in invia_risposta, comune a email e DM) — _valuta_e_rispondi non invia mai direttamente: scrive solo approvals (1088-1099) e chiama chiedi_approvazione (1102). CATENA A DUE ANELLI (non modellata separatamente da questa mappa, 10/9/2026): questa guardia si fida del valore di approvals.stato, che non scrive da sé — lo scrive il componente condiviso approvazione_telegram (transizioni via UPDATE...WHERE stato=atteso, backend/main.py:283-423). Un difetto in quelle transizioni (es. una che permette rifiutata→approvata, o un claim non atomico) svuota questa garanzia senza toccare una riga di worker/loop.py:1228-1232."
      - id: RE02
        enunciato: "Un bounce definitivo entra in soppressioni prima di qualunque altro invio a quell'indirizzo"
        garantito_da: nessuno
      - id: RE03
        enunciato: "Un'email riconosciuta come warmup (tag noto o pattern strutturale dell'oggetto) non genera mai una risposta automatica"
        garantito_da: "connectors/imap_reader.py:196-198 (classifica_messaggio → motivo 'warmup' se _contiene_tag_warmup o _e_pattern_warmup_soggetto) + worker/loop.py:349,387-391 (motivo_scarto non-None → tipo_evento 'email.filtrata', nessun job notifica_risposta accodato)"
      - id: RE04
        enunciato: "La risposta esce sempre dalla stessa casella che ha ricevuto il messaggio originale"
        garantito_da: "worker/loop.py:1311-1322 (password_per(destinatario_originale), invia_risposta_email(...,destinatario_originale, mittente_pass)) + connectors/mailer.py:46-53 (From = mittente_user, il parametro passato)"
    evidenza:
      - "catena reale nel codice: leggi_email -> notifica_risposta -> _valuta_e_rispondi (condivisa) -> approvazione Telegram -> invia_risposta (ramo email). 'Lettura IMAP' e 'risposte email' nominate come due pipeline separate nel prompt originale sono la stessa catena — DECISIONE confermata con Leonardo il 9/9/2026 (STATO.md)"
      - "leggi_email: worker/loop.py:314-413, chiama connectors.imap_reader.leggi_nuove() (316) per i filtri deterministici, scrive events 375-381 — CORRETTO al passo 2, mancava in tabelle.scrive"
      - "dedup_key: worker/loop.py:330-344,373-381 — imap:{message_id} o imap-sint:{sha256(...)} se manca Message-ID, ON CONFLICT (dedup_key) DO NOTHING"
      - "bounce definitivo -> soppressioni: worker/loop.py:392-398 (ON CONFLICT (tipo,valore) DO NOTHING) — MA nessun punto del codice legge soppressioni prima di un invio automatico: vedi RE02 e STATO.md, sezione DECISIONI APERTE"
      - "riaccodo perenne ogni 2 minuti: worker/loop.py:408-413, auto-guarito da garantisci_leggi_email (loop.py:1554-1562, componente di manutenzione_sistema)"
      - "notifica_risposta: worker/loop.py:916-967, legge events 924-928, scrive messages direzione 'in' con guardia ON CONFLICT (thread_id,canale,direzione) 939-945"
      - "scrive anche alert_inviati tramite il condiviso alert_una_volta (worker/loop.py:749-764, INSERT ... ON CONFLICT DO NOTHING RETURNING chiave), usato dentro invia_risposta per l'alert di invio fallito — CORRETTO al passo 4 (verifica_mappa.py): mancava in tabelle.scrive nonostante alert_una_volta fosse già elencato in condivisi"
      - "invia_risposta (condiviso): legge approvals+messages JOIN events 1216-1277, guardia scadenza+stato 1210-1259 (comune a email e DM — CORRETTO al passo 2: mancavano approvals e messages in tabelle.legge), ramo email 1287-1327 scrive messages, invia con connectors.mailer.invia_risposta_email usando password_per() (connectors.imap_reader) per la casella originale, Reply-To = env REPLY_SMTP_USER letto qui dentro (loop.py:1317 — env del condiviso invia_risposta, non di questa pipeline, per la regola A2)"
      - "errore di classificazione/bozza terminale, mai ritentato: DECISIONI APERTE in STATO.md — la guardia su messages è scritta prima della classificazione, un retry del job vede 'già notificato' ed esce senza richiamare l'LLM"
      - "MAILBOX_{n}_USER/PASS configurate in .env vanno da 1 a 6 (grep sui nomi, 9/9/2026): 4 caselle attive + 2 in warmup, confermato da Leonardo (9/9/2026) — le altre 2 caselle in arrivo non sono ancora in .env, previsto passaggio a 8 quando entreranno in warmup"
      - "DA_VERIFICARE: il filtro warmup (RE03) è basato sul CONTENUTO del messaggio (tag o pattern d'oggetto), non sull'identità della casella — il codice non sa quali MAILBOX_N sono 'in warmup' nel senso operativo di Leonardo, legge tutte le caselle configurate allo stesso modo. Se una casella in warmup ricevesse un'email di warmup che non rispetta il tag/pattern noto, verrebbe processata come una risposta vera"

  - nome: dm_instagram_facebook
    stato: produzione
    sede: vps
    attivazione: "webhook POST /webhook/ghl/dm"
    produce:
      - notifica Telegram del DM ricevuto (canale, mittente, countdown scadenza, anteprima testo)
      - riga in approvals + richiesta di approvazione, stessa logica delle email
      - risposta DM inviata via GHL dopo approvazione
    codice:
      - "backend/main.py:180-273"
      - "worker/loop.py:1136-1194"
      - "worker/loop.py:1210-1388"
      - "worker/loop.py:1462-1531"
      - "worker/loop.py:1534-1551"
      - "connectors/ghl.py"
    tabelle:
      legge: [events, approvals, messages]
      scrive: [events, jobs, messages, soppressioni, contacts, approvals, alert_inviati]
    condivisi:
      - valuta_e_rispondi
      - invia_risposta
      - classificatore
      - drafter
      - approvazione_telegram
      - alert_una_volta
    env:
      - GHL_WEBHOOK_SECRET
      - GHL_API_TOKEN
      - GHL_API_VERSION
    esterni: [GHL/GoHighLevel, Anthropic API (Haiku, via classificatore/drafter condivisi), Telegram]
    contratti:
      - id: DM01
        enunciato: "Nessuna risposta esce oltre la finestra Meta di 24h"
        garantito_da: "worker/loop.py:1234-1259 (controllo scadenza comune a invia_risposta, eseguito PRIMA del ramo per canale — se scadenza < now(), l'approvazione viene chiusa 'scaduta' e non si invia nulla)"
      - id: DM02
        enunciato: "Lo stesso DM non riceve mai due risposte"
        garantito_da: nessuno
      - id: DM03
        enunciato: "reply_channel grezzo non è mai usato direttamente come canale: passa sempre da _normalizza_canale_dm, che scarta i valori non riconosciuti"
        garantito_da: "backend/main.py:21-30 (_normalizza_canale_dm, match per sottostringa case-insensitive) + backend/main.py:231-234 (evento scartato, non scritto in events, se il canale normalizzato è None)"
      - id: DM04
        enunciato: "Nessuna risposta DM redatta dall'LLM esce senza passare da approvals in stato approvata o modificata"
        garantito_da: "worker/loop.py:1228-1232 (stessa guardia condivisa di RE01, comune a email e DM). Stessa catena a due anelli di RE01 (10/9/2026): la guardia si fida di approvals.stato, scritto dal componente condiviso approvazione_telegram — un difetto nelle sue transizioni di stato svuota la garanzia senza toccare questa guardia."
    evidenza:
      - "route: backend/main.py:180-273 (POST /webhook/ghl/dm), auth header X-Argo-Secret vs GHL_WEBHOOK_SECRET (182-183)"
      - "scrive events: backend/main.py:252-262 (dm.received) — CORRETTO al passo 2, mancava in tabelle.scrive"
      - "dedup_key: backend/main.py:237,254-262 (ghl-dm:{contact_id}:{triggered_at}) — DA_VERIFICARE: non esiste conversation_id né id univoco di messaggio nel payload GHL (STATO.md, sezione dedup_key DM); dedup_key su triggered_at grezzo dedupe solo repliche esatte dello stesso webhook, non lo stesso DM reale rinviato con un triggered_at diverso — vedi DM02"
      - "job accodato: backend/main.py:269-271 (notifica_dm)"
      - "handler notifica_dm: worker/loop.py:1136-1194, legge events (1144-1150, incluso contact_id esterno GHL non risolto su contacts — nota a 1161-1165), scrive messages con contact_id NULL (1166-1175), chiama _valuta_e_rispondi passando contatto_where_col='ghl_contact_id'"
      - "_valuta_e_rispondi (condiviso, invocato da qui) scrive anche soppressioni (worker/loop.py:1023-1027, tipo=canale instagram/facebook, valore=contact_id_ghl) e contacts (1041-1045, UPDATE ... WHERE ghl_contact_id) quando la categoria è di soppressione — CORRETTO al passo 2: soppressioni e contacts mancavano in tabelle.scrive nonostante il codice condiviso li scriva anche in questo ramo"
      - "scrive anche alert_inviati tramite il condiviso alert_una_volta (worker/loop.py:749-764, INSERT ... ON CONFLICT DO NOTHING RETURNING chiave), usato dentro invia_risposta per l'alert di invio fallito — CORRETTO al passo 4 (verifica_mappa.py): mancava in tabelle.scrive nonostante alert_una_volta fosse già elencato in condivisi"
      - "invia_risposta ramo DM: worker/loop.py:1329-1386, guardia scadenza specifica DM comune con email (1234-1259), invio via connectors.ghl.invia_messaggio (1347), salvataggio conversationId/messageId in messages.payload (1356-1365)"
      - "handler di test (non produzione, ma stesso codice): test_approvazione_dm worker/loop.py:1462-1531, test_invio_dm worker/loop.py:1534-1551 (quest'ultimo non tocca il DB, lo dice esplicitamente a 1536-1538)"

  - nome: manutenzione_sistema
    stato: produzione
    sede: vps
    attivazione: >
      poll nel loop principale del worker (ogni 5s: tre garantisci_* +
      recover_orphaned_jobs + migra_job_notifica_risposta all'avvio) +
      poll controlli_periodici (ogni 15 minuti) + orario fisso
      digest_serale (22:00 Europe/Rome)
    produce:
      - alert Telegram (approvazioni bloccate >6h, poster mancante entro 30 min, volume anomalo >50 eventi/ora, scadenza approvals vicina entro 2h)
      - chiusura autonoma di approvals scadute
      - digest testuale serale via Telegram
      - riaccodo automatico dei job perenni se mancanti (self-healing)
    codice:
      - "worker/loop.py:441-746"
      - "worker/loop.py:749-913"
      - "worker/loop.py:1554-1647"
    tabelle:
      legge: [jobs, events, messages, approvals, soppressioni, alert_inviati]
      scrive: [alert_inviati, approvals, jobs]
    condivisi: [alert_una_volta, telegram_notifica]
    env: []
    esterni: [Telegram]
    contratti:
      - id: MS01
        enunciato: "Un'approvazione scaduta viene chiusa entro 15 minuti dalla scadenza"
        garantito_da: "worker/loop.py:841-892 (_controllo_scadenza_vicina chiude le scadute) richiamato da controlli_periodici ogni 15 minuti (worker/loop.py:895-913, riaccodo con run_after = now() + interval '15 minutes')"
      - id: MS02
        enunciato: "Il digest serale non salta le 22:00 anche a worker riavviato"
        garantito_da: "worker/loop.py:1576-1601 (garantisci_digest_serale, chiamata all'avvio e a ogni giro del loop; se le 22:00 di oggi sono già passate senza un job pending/running, lo riaccoda subito invece di aspettare il giorno dopo)"
      - id: MS03
        enunciato: "Nessun job resta in 'running' oltre un riavvio del worker"
        garantito_da: "worker/loop.py:1616-1625 (recover_orphaned_jobs, UPDATE jobs SET stato='pending' WHERE stato='running', eseguito a ogni avvio) — vedi MS04 per il limite di questa garanzia"
      - id: MS04
        enunciato: "recover_orphaned_jobs è corretto solo con un worker unico: con due, un riavvio rimetterebbe a pending job ancora vivi dell'altro worker"
        garantito_da: "docker-compose.yml, servizio worker senza deploy/replicas dichiarate (default: un solo container) — non è un guard nel codice, solo la topologia del compose; il commento a worker/loop.py:1617-1620 documenta l'assunzione ma non la impone"
    evidenza:
      - "DA_VERIFICARE / SOSPESO: questo flusso non è uno dei quattro nominati all'apertura del cantiere — non è innescato da un evento di dominio (poster/email/DM), opera sul sistema stesso (job, alert, digest). Trattato come quinta scheda pipeline, non come componente condiviso: DECISIONE confermata con Leonardo il 9/9/2026 (STATO.md)"
      - "loop principale ogni 5s: worker/loop.py:1643 (time.sleep(5)), claim_job worker/loop.py:68-95 (SELECT ... FOR UPDATE SKIP LOCKED + UPDATE stato='running')"
      - "controlli_periodici ogni 15 min: worker/loop.py:895-913, orchestratore di _controllo_approvazioni_bloccate (767-789), _controllo_poster_mancante (792-813), _controllo_volume_anomalo (816-838), _controllo_scadenza_vicina (841-892)"
      - "digest_serale: worker/loop.py:619-746, legge approvals/jobs/events/messages/soppressioni/alert_inviati in sola lettura (622-724 — legge alert_inviati a 697-701, CORRETTO al passo 2: mancava in tabelle.legge), riaccoda sé stesso alle 22:00 (738-743, prossimo_orario_digest)"
      - "idempotenza propria: _alert_una_volta worker/loop.py:749-764 (INSERT INTO alert_inviati ... ON CONFLICT DO NOTHING RETURNING chiave, chiave è PRIMARY KEY — db/migrations/002_alert_inviati.sql) — non è dedup_key su events né guardia di stato operatore, è un terzo meccanismo"
      - "self-healing: garantisci_leggi_email/controlli_periodici/digest_serale (worker/loop.py:1554-1601, SELECT 1 FROM jobs WHERE tipo=%s AND stato IN ('pending','running'), reinseriscono il job se assente, eseguite a ogni giro del loop)"
      - "recover_orphaned_jobs: worker/loop.py:1616-1625 — presuppone un solo worker, commento esplicito a 1617-1620. Verificato al passo 2: docker-compose.yml non dichiara repliche per il servizio worker, quindi l'assunzione è corretta oggi (MS04)"
      - "migra_job_notifica_risposta: worker/loop.py:1604-1613, migrazione una tantum all'avvio (rinomina job classifica_messaggio -> notifica_risposta), non più rilevante a regime ma resta nel codice"

  - nome: lead_gen_host
    stato: concluso_roma
    sede: vps
