      - id: AV02
        enunciato: "Panoptes deposita in osservazioni; solo Argo aggiorna osservazioni.stato"
        garantito_da: "PASSO 8 (11/9/2026): scripts/argo/orienta_webhook.py:_marca_avviso_inviato (UPDATE osservazioni SET stato='riferita' WHERE id=... AND stato='nuova', via docker exec psql — nessun altro punto del codice scrive osservazioni.stato) copre solo la metà 'solo Argo aggiorna osservazioni.stato'. La metà 'Panoptes deposita in osservazioni' resta senza scrittore: nessuna pipeline Panoptes esiste ancora (osservazioni_nuove() vede tuttora zero righe, vedi evidenza sotto)."
      - id: AV03
        enunciato: "In modo orienta, la risposta non elenca tutto lo stato: sceglie una sola prossima cosa e dichiara esplicitamente le fonti a copertura parziale/assente invece di riempire il buco"
        garantito_da: eval
      - id: AV04
        enunciato: "Un /orienta scritto mentre una richiesta precedente è già in coda non genera una seconda chiamata LLM"
        garantito_da: "backend/main.py:437-443 (pg_advisory_xact_lock(hashtext('genera_orienta_enqueue')) prima del check-poi-insert su tipo='genera_orienta' AND stato IN ('pending','running')) — al più un job in volo, non un cooldown temporale: una richiesta dopo che la precedente è finita (done/failed) ne accoda una nuova regolarmente. Il lock non è decorativo: sotto READ COMMITTED un WHERE NOT EXISTS da solo non è atomico fra connessioni concorrenti — stesso difetto e stesso fix di garantisci_leggi_email/controlli_periodici/digest_serale (worker/loop.py, 11/9/2026), trovato in questo passo dalla review guardrail prima del commit."
      - id: AV05
        enunciato: "Un brief non cita un file, un comando o un numero assente dal contesto raccolto sul cantiere"
        garantito_da: eval
      - id: AV06
        enunciato: "/brief con un nome cantiere ambiguo o non trovato risponde con l'elenco dei nomi validi, mai un cantiere indovinato a caso"
        garantito_da: "argo/voce.py:_risolvi_cantiere + genera_brief (match per sottostringa sulla riga di STATO.md, zero o più di un risultato ritorna l'elenco fisso senza mai chiamare connectors/llm.py:chiama())"
      - id: AV07
        enunciato: "Un file citato nel contesto di un brief che tocca un componente condiviso o un contratto genera sempre un avvertimento nei Vincoli del brief, composto in Python — mai lasciato all'LLM"
        garantito_da: "argo/voce.py:_verifica_impatti_brief (interroga impatti.py sui file citati, deterministico) + _componi_brief (accoda l'avvertimento a VINCOLI_STANDARD_BRIEF nella sezione ## Vincoli prima di restituire il testo, il modello non vede mai questo blocco)"
    evidenza:
      - "DEROGA alle sei tabelle base dello schema, motivata in STATO.md: osservazioni/mandati non si adattano alla semantica delle tabelle esistenti (events è per eventi di dominio con dedup_key da trigger esterni; messages traccia conversazioni host/prospect, non comunicazione interna tra sottosistemi)."
      - "DEROGA puntuale alla convenzione 'niente CHECK' del repo, anch'essa motivata in STATO.md: osservazioni.stato e mandati.tipo sono gli unici due CHECK nello schema — sono gli enum su cui poggia il guardrail 'Argo traduce, non origina', un valore fuori enum su tipo aprirebbe una terza categoria di mandato non prevista."
      - "AV01 è oggi un vincolo di schema, non di codice: nessun processo scrive ancora in mandati — pronto per quando Argo verrà costruito (prossimo cantiere)."
      - "AV02 (PASSO 8, 11/9/2026): metà 'solo Argo aggiorna osservazioni.stato' ora implementata (scripts/argo/orienta_webhook.py:_marca_avviso_inviato). Metà 'Panoptes deposita' resta senza scrittore — nessuna pipeline Panoptes esiste ancora, osservazioni_nuove() vede zero righe (collaudo 10/9/2026 e ripetuto in questa sessione)."
      - "DEVIAZIONE (10/9/2026, decisione di Leonardo): argo/stato.py non usa psycopg diretto come il resto del repo — legge il DB via 'docker exec argo-db-1 psql' da subprocess, per poter girare interamente su host (dove STATO.md e .git sono raggiungibili nativamente; il Dockerfile non li copia nell'immagine). Deviazione dichiarata per un tool diagnostico sola-lettura lanciato a mano, non per codice di pipeline."
      - "'escalations' non esiste nello schema, né nel DB, né nel codice — confermato anche in knowledge/registro_attriti.md:115. escalation_aperte() (argo/stato.py) legge alert_inviati come proxy dichiarato (finestra 24h, prefisso della chiave mappato a categoria): quella tabella è un log 'inviato una volta' senza stato aperto/risolto, e alcuni alert reali (tetto giornaliero LLM in connectors/llm.py, notifica di job fallito in worker/loop.py:136, alert ad-hoc di backend/main.py) non ci passano mai — copertura dichiarata parziale, non nascosta."
      - "jobs non ha updated_at/started_at, solo created_at: job_falliti() (argo/stato.py) lo dichiara come limite (copertura parziale) invece di far finta di sapere da quando un job 'running' è davvero bloccato."
      - "collaudo dal vivo (10/9/2026): 111 job failed reali nel DB (109 digest_serale con lo stesso errore storico thread_id::int, già noto), un'approvazione ferma da giorni (id=10), zero osservazioni/mandati (nessun writer ancora) — output completo in STATO.md, sessione del giorno."
      - "PASSO 3 (11/9/2026): cantieri_aperti() ora legge anche un blocco strutturato '## CANTIERI' in testa a STATO.md (_estrai_cantieri, nuovo in argo/stato.py) — copertura 'completa' quando il blocco è presente e ben formato (intestazioni + vocabolario fisso di Stato/Aspetta), 'parziale' con motivo altrimenti. Le due sezioni alla lettera ('In corso', 'DECISIONI APERTE — bloccano') restano sempre esposte, non solo come fallback. Nessuna nuova tabella letta, nessun writer aggiunto — resta un lettore puro."
      - "PASSO 4 (11/9/2026): argo/voce.py:genera_risposta chiama connectors/llm.py:chiama() direttamente (Haiku, temperatura 0), senza passare da brain/classifier.py o brain/drafter.py — nessun enum di categorie, nessuna base di conoscenza, solo testo libero per Leonardo a partire da SOUL/IDENTITY/USER.md + le sei fonti di argo/stato.py serializzate. connectors/llm.py è quindi bare nel codice di tre schede (classificatore, drafter, argo_voce): stesso file, tre punti di ingresso indipendenti, già tollerato da verifica_mappa.py per classificatore/drafter."
      - "AV03 garantito_da: eval, stesso trattamento di CD01/CD02 (drafter): proprietà di un testo generato da un LLM, nessuna guardia deterministica può verificarla a runtime. Validata solo a mano in questa sessione (un lancio reale di scripts/argo/orienta.py, testo incollato in STATO.md) — nessuna suite di eval automatica ancora, come per CD01/CD02."
      - "ARGO_VOCE_BOT_TOKEN (nuovo in .env) è un secondo bot Telegram, letto direttamente in scripts/argo/orienta.py e passato al parametro opzionale `token` di connectors/telegram.py:notifica() — il bot meccanico (TELEGRAM_TOKEN, approvazioni/alert esistenti) resta invariato, notifica(testo) senza token usa ancora TELEGRAM_TOKEN come prima. Stesso TELEGRAM_CHAT_ID per entrambi i bot."
      - "PASSO 5 (11/9/2026): normalizza_comando (nuovo in connectors/telegram.py, pura, zero rete/DB) estrae il primo token di un messaggio Telegram gestendo il suffisso '@NomeBot' dei gruppi — vive nel condiviso telegram_notifica e non in backend/main.py apposta: quel modulo importa psycopg/fastapi, non installati nell'ambiente host usato da tests/, quindi non importabile per un test unitario. tests/test_webhook_argo.py copre normalizza_comando più un guardrail statico (letto come testo, non importato) che backend/main.py usi davvero COMANDO_ORIENTA='/orienta'."
      - "PASSO 5, decisione con Leonardo: niente refactor di argo/stato.py dentro Docker (avrebbe richiesto psycopg diretto + bind-mount di STATO.md/.git nel container + git nell'immagine) — si tiene la deviazione host-only com'è, ponte via jobs + cron. Costo accettato: latenza fino a ~1 minuto (granularità cron) prima che orienta_webhook.py veda il job, più una riga di crontab che Leonardo aggiunge a mano (non nel repo, vedi STATO.md)."
      - "PASSO 6 (11/9/2026): argomenti_comando e interpreta_instrada (nuove in connectors/telegram.py, pure, zero rete/DB) vivono nel file condiviso telegram_notifica per lo stesso motivo di normalizza_comando al passo 5 (backend/main.py non importabile da tests/, gira solo in Docker) — non sono logica della funzione notifica() in sé, sono parsing di /instrada, semplicemente co-locate nello stesso file per restare testabili. tests/test_webhook_argo.py le copre entrambe, tutti i rami (mancante/non valido per ciascun parametro)."
      - "PASSO 6: backend/main.py:414-504 (ex 407-466) e connectors/telegram.py:35-209 (ex 35-154) sono i nuovi confini dopo l'inserimento di COMANDO_INSTRADA/_accoda_job_argo/interpreta_instrada — approvazione_telegram (condiviso) aggiornato di conseguenza sui propri range in backend/main.py, spostati dalla stessa causa (righe inserite più in alto nel file)."
      - "CANTIERE ARGO — IL PONTE, PASSO 1 (12/9/2026): AV05 garantito_da: eval, stesso trattamento di AV03/CD01/CD02 — proprietà di un testo generato da un LLM (Contesto/Obiettivo/Criterio di chiusura del brief), nessuna guardia deterministica può verificarla a runtime. Validata a mano in questo passo su un cantiere reale (vedi STATO.md per il testo generato); nessuna suite di eval automatica ancora, come per AV03/CD01/CD02."
      - "PASSO 1 (ponte): backend/main.py:414-524 (ex 414-504) dopo l'inserimento di COMANDO_BRIEF/RISPOSTA_BRIEF_SENZA_NOME e del ramo /brief in _gestisci_messaggio_argo — approvazione_telegram (condiviso) non tocca queste righe, nessun aggiornamento al suo range necessario. worker/loop.py:claim_job (60-70/83-85/1635-1668, invariati) ha guadagnato 'genera_brief' nella stessa esclusione NOT IN, stessa riga, nessuno spostamento di riga nel file."
      - "PASSO 2 (ponte, 12/9/2026) — comando /impatto: backend/main.py:414-572 (ex 414-524) dopo COMANDO_IMPATTO/RISPOSTA_IMPATTO_SENZA_ARGOMENTO/_registra_mandato/il ramo /impatto — approvazione_telegram (condiviso) sposta webhook_telegram da 527-543 a 575-591, stesso tipo di aggiustamento dei passi precedenti. worker/loop.py:claim_job (60-70 invariato, 83-85→83-88, 1635-1668→1636-1669: +1 riga uniforme da qui in poi) ha guadagnato 'genera_impatto' nella stessa esclusione NOT IN. DECISIONE presa nel piano, non nel codice: impatti.py non ha un flag --json (l'obiettivo del brief lo assumeva, il vincolo 'non modificarlo' vince) — genera_impatto lo invoca nella sua unica modalità reale (testo su stdout/stderr) e fa tradurre l'LLM sotto anti-invenzione rinforzata; sull'errore vero (returncode != 0, percorso/componente inesistente) zero chiamata LLM, il messaggio di impatti.py è rilanciato com'è. Il secondo uso del brief, rinviato in questo passo, è implementato al PASSO 3 sotto."
      - "PASSO 3 (ponte, 12/9/2026) — fix troncamento /impatto + /brief consapevole degli impatti. (1) MAX_TOKENS_RISPOSTA (200) troncava a metà frase una consultazione con molti contratti (collaudo reale, /impatto mailer: 8 contratti, ~3085 caratteri di output grezzo) — nuova MAX_TOKENS_IMPATTO=700 dedicata al solo modo impatto, e connectors/llm.py:chiama() guadagna un parametro opt-in marcatore_se_troncato (default None, nessun altro chiamante toccato) che accoda un marcatore esplicito se stop_reason=='max_tokens' — mai un taglio silenzioso, stessa logica di _tronca() per il testo in ingresso. (2) genera_brief interroga ora impatti.py --file sui percorsi citati nel proprio campo 'contesto' che esistono davvero sul filesystem (stesso controllo deterministico di _risolvi_flag_impatti — un nome nudo indovinato male dal modello, es. pavimento.mjs, semplicemente non passa il controllo: nessun avviso, nessun errore), fino a LIMITE_FILE_IMPATTI_BRIEF=8 per contenere il costo. L'output di impatti.py (formato fisso, mai modificato) è analizzato a riga da _analizza_output_impatti_file/_contratti_in_gioco: un file che tocca un componente condiviso o almeno un contratto produce un avvertimento accodato ai Vincoli standard da _componi_brief (mai passato al modello, vedi AV07); nessun file con impatti -> nessun avvertimento, zero righe vuote, come per avvisa. Un solo mandato di consultazione per invocazione di /brief (non uno per file, per non far crescere la tabella quando un brief ne cita molti), registrato da scripts/argo/orienta_webhook.py:_registra_mandato_brief SOLO se almeno un file citato esisteva davvero (altrimenti nessuna consultazione, nessun mandato). backend/main.py guadagna origine_msg anche sul ramo /brief (stesso stile di /impatto), passato nel payload del job perché il mandato nasce solo dopo l'esecuzione, non alla ricezione del comando. Collaudato a mano su tre file reali: connectors/mailer.py (condiviso mailer + contratto RE04, genera avvertimento), argo/voce.py (mappato ma zero condivisi/contratti, nessun avvertimento), tests/test_argo_voce.py (non mappato, nessun avvertimento) — tests/test_argo_voce.py copre tutti e tre i casi con invocazioni reali di impatti.py, zero LLM. Range backend/main.py aggiornati: argo_voce 414-572→414-577 (+5, dal docstring esteso di _gestisci_messaggio_argo e dalla riga origine_msg nel ramo /brief), approvazione_telegram 575-591→580-596 (stesso +5, nessuna riga toccata dentro quella funzione)."

