      - "tabelle: risolvi.py scrive/legge events(179), contacts(carica_indice_debole, ~229; crea_contatto/completa_campi_vuoti/completa_citta/aggiorna_n_strutture), identities (contatti_matchati legge ~85; aggancia_identita scrive ~104); estrai_email.py legge/scrive contacts, scrive identities (canale='email'); estrai_social.py legge/scrive solo contacts; export_prospect.py legge contacts/identities/events (JOIN su dedup_key); export_instantly.py legge contacts/soppressioni, nessuna scrittura (dichiarato nel proprio docstring); cerca_places.py non tocca alcuna tabella (scrive solo file) — CORRETTO al passo 2: events mancava in tabelle.scrive, identities mancava in tabelle.legge"
      - "connectors/normalizza.py e connectors/fetch.py usati solo da script di questa pipeline (oltre che da tests/) — regola del due non soddisfatta, restano in codice della scheda, non in condivisi — CORRETTO al passo 2: l'evidenza del passo 1 lo dichiarava ma i due file mancavano dall'elenco codice"
      - "env: connectors/places.py:69 (PLACES_API_KEY) — PG_PASSWORD rimosso dalla scheda al passo 2: è env di infrastruttura generica (letta da ogni db_connect() del repo), va in infrastruttura:, non ripetuta per pipeline (regola A2)"
