            tabella. Letta a mano al passo 2 (9/9/2026), confermata reale.
        - campo: tabelle.legge
          valore: soppressioni
          motivo: >
            stesso caso: query costruita in una variabile in
            scripts/export_instantly.py:104-118 (NOT EXISTS (SELECT 1 FROM
            soppressioni ...)). Letta a mano al passo 2 (9/9/2026),
            confermata reale.
    condivisi: [telegram_notifica]
    env:
      - PLACES_API_KEY
    esterni: [Google Places API]
    contratti:
